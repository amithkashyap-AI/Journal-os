services:
  postgres:
    image: postgres:16-alpine
    container_name: rpos-postgres
    environment:
      POSTGRES_USER: rpos
      POSTGRES_PASSWORD: rpos_dev_password
      POSTGRES_DB: rpos
    ports:
      # 5433 on the host: leaves room for a natively installed Postgres on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rpos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
